# docker compose -f deploy/docker-compose.yml up --build
name: backdock
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: image_scanner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d image_scanner"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      target: web
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@postgres:5432/image_scanner
    command: ["flask", "db", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ..
      target: web
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@postgres:5432/image_scanner
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully


  # docker compose -f deploy/docker-compose.yml --profile forecaster run --rm forecaster
  forecaster:
    profiles: ["forecaster"]
    build:
      context: ..
      target: forecaster
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@postgres:5432/image_scanner
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
