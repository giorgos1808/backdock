{% extends "base.html" %}

{% block title %}Scan supplier order — Backdock{% endblock %}

{% block content %}
<div class="hero">
  <h1>Scan a supplier order</h1>
  <p>Upload the order document you received from a supplier. Line items are extracted automatically.</p>
</div>

<div class="card">
  <form class="drop" action="{{ url_for('orders.scan_order') }}" method="post" enctype="multipart/form-data">
    <input type="file" name="document" accept=".png,.jpg,.jpeg,.pdf" required>
    <button type="submit">Scan order</button>
  </form>
</div>

<a class="back-link" href="{{ url_for('pages.index') }}">&larr; Back to dashboard</a>
{% endblock %}
